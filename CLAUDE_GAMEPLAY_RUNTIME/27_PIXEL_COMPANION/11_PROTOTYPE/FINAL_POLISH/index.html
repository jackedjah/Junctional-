<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAHFITT Pixel Companion</title>
  <link rel="stylesheet" href="styles.css?v=final-polish">
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="MAHFITT mascot preview">
      <canvas id="mascot" width="512" height="512"></canvas>
    </section>
    <section class="controls">
      <h1>MAHFITT Pixel Companion</h1>
      <p>Local indexed-theme sprite runtime</p>
      <label>Character<select id="character"><option>female</option><option>male</option></select></label>
      <label>Theme<select id="theme"><option>blue</option><option>gold</option><option>red</option><option>purple</option><option>pink</option><option>green</option></select></label>
      <label>Animation<select id="animation"></select></label>
      <div class="buttons"><button id="play">Play</button><button id="idle">Return to idle</button></div>
      <label class="toggle"><input id="reduced" type="checkbox"> Reduced motion</label>
      <output id="status">Loading…</output>
    </section>
  </main>
  <script type="module" src="runtime.js?v=final-polish"></script>
</body>
</html>
