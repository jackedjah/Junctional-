# FOB Systems - hosting config

[build]
  publish = "."

# Modern, explicit function config. netlify/functions is also Netlify's
# default location, so this is declared two ways for maximum compatibility.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---- FOB Community ------------------------------------------------------
[[redirects]]
  from = "/community"
  to = "/community/index.html"
  status = 200

[[redirects]]
  from = "/community/login"
  to = "/community/auth.html"
  status = 200

# Private community surfaces must never be indexed.
[[headers]]
  for = "/community/auth.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/community/onboarding.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/community/home.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"


# ---- Public data-source credits ------------------------------------------
[[redirects]]
  from = "/credits"
  to = "/credits.html"
  status = 200

[[headers]]
  for = "/credits.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

