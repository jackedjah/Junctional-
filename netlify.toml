  from = "/mahfitt-support-thanks"
  to = "/mahfitt-support-thanks.html"
  status = 200

[[headers]]
  for = "/mahfitt*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/mahfitt-support-thanks*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ══ PWA ═══════════════════════════════════════════════════════════════════
# The service worker must never be cached, or a deploy cannot replace it and
# the app pins itself to an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"


# ══ FUNCTION RUNTIME ══════════════════════════════════════════════════════
# The vision provider is called with native fetch, which requires Node 18 or
# newer. Pinned so a stale platform default cannot silently break the provider
# request while every other function keeps working. No SDK is bundled: both
# providers are reached over plain HTTPS, so there is no dependency that can
# fail to bundle.
[build.environment]
  NODE_VERSION = "20"

[functions."calendar-email-dispatch"]
  schedule = "@hourly"
