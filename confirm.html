<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>FOB SESH Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/claim-flow.css?v=389">
  <meta name="theme-color" content="#0E1114"><meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    body{opacity:0}.is-member-authorized body{opacity:1;transition:opacity .12s ease}.schedule-card{max-width:590px;margin:18px auto;padding:18px;border:1px solid rgba(233,201,143,.3);background:rgba(255,255,255,.025);text-align:left}.schedule-card h3{margin:0 0 10px;color:#f3ece0;font-size:15px}.schedule-card p{color:#a8a299;font-size:13px;line-height:1.58}.schedule-link{display:flex!important;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:14px}.schedule-list{margin:12px 0;padding:0 4px 0 0;list-style:none;display:grid;gap:7px;max-height:226px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.schedule-list li{padding:9px 10px;border-left:2px solid #e9c98f;background:rgba(233,201,143,.06);color:#e8e1d7;font-size:12px}.schedule-warning{border-left:2px solid #e9c98f;padding:10px 12px;color:#aaa39a;font-size:12px;line-height:1.55}.group-final-actions{display:flex;gap:12px;align-items:center;justify-content:center}.group-back-arrow{color:#e9c98f;text-decoration:none;font-size:24px}.flow-btn:disabled{opacity:.4}.presesh-link{display:inline-block;color:#f3ece0;text-underline-offset:4px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.card-privacy{max-width:520px;margin:14px auto 0;color:#807b74;font:500 9px/1.55 ui-monospace,monospace;letter-spacing:.06em;text-align:center}
  </style>
  <script>(async function(){try{var r=await fetch('/api/claim-status?t='+Date.now(),{credentials:'same-origin',cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok){location.replace('/mygym?entry=slots');return}document.documentElement.classList.add('is-member-authorized')}catch(e){location.replace('/mygym?entry=slots')}})()</script>
</head>
<body class="flow-page">
  <div class="flow-bg" aria-hidden="true"></div>
  <main class="flow-wrap">
    <div class="flow-divider"><span class="flow-beam"></span></div>
    <header class="flow-top"><p class="flow-ey">FOB Systems</p><h1 class="flow-title compact" id="title">SESH CHECKOUT</h1><div class="flow-rule-short"></div><p class="flow-sub" id="sub">Schedule first. Pay second.</p></header>
    <section class="flow-shell">
      <span class="flow-label">Your Selection</span>
      <div class="flow-option" style="grid-template-columns:1fr;text-align:center;min-height:110px"><strong id="sel">FOB SESH</strong></div>
      <div id="copy" class="schedule-card"></div>
      <div id="actions" class="group-final-actions"></div>
      <p class="card-privacy">Your card information is never saved or stored by FOB Systems. Secure checkout is handled by Stripe.</p>
    </section>
    <div class="flow-divider"><span class="flow-beam"></span></div>
  </main>
<script>
(function(){'use strict';var q=new URLSearchParams(location.search),pack=q.get('pack'),price=q.get('price'),group=q.get('group'),schedule=q.get('schedule'),title=document.getElementById('title'),sub=document.getElementById('sub'),sel=document.getElementById('sel'),copy=document.getElementById('copy'),actions=document.getElementById('actions');
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function when(v){return new Date(v).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
if(group){var day=q.get('day')||'',time=q.get('time')||'',park=q.get('park')||'Banneker Playground';title.innerHTML='GROUP ACCESS<br>UNLOCKED';sub.textContent='Your cohort is ready.';sel.innerHTML=h(day)+'<small style="display:block;margin-top:10px;color:#a9916c;font-size:10px;letter-spacing:.18em">'+h(time)+' · '+h(park)+'</small>';copy.innerHTML='<h3>Group schedule confirmed</h3><p>Confirm this is the group you want, then continue directly to secure payment.</p>';actions.innerHTML='<button class="flow-btn gold" id="groupPay" type="button">Confirm & Pay</button><a class="group-back-arrow" href="/small-group-access" aria-label="Back to groups">←</a>';document.getElementById('groupPay').onclick=async function(){var b=this;b.disabled=true;b.textContent='OPENING PAYMENT…';try{var r=await fetch('/api/group-checkout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({cohort:group})}),j=await r.json();if(!r.ok||!j.ok||!j.url)throw new Error(j.error||'Checkout could not be opened.');location.href=j.url}catch(e){copy.innerHTML='<h3>Payment did not open</h3><p>'+h(e.message)+'</p>';b.disabled=false;b.textContent='Confirm & Pay'}};return}
if(!pack||!price){location.replace('/claim-your-slot');return}sel.textContent=pack+' SESH · $'+Number(price).toLocaleString();
function calendarButton(label){return'<a class="flow-btn gold schedule-link" href="/calendar?checkout=1&pack='+encodeURIComponent(pack)+'&source=payment">'+label+'</a>'}
if(!schedule){copy.innerHTML='<h3>Choose your schedule before payment</h3><p>Tap the calendar, choose exactly '+h(pack)+' available session time'+(pack==='1'?'':'s')+', and return here. You can also set a weekly recurring rhythm. Your preferred park and Jah’s live availability are applied automatically.</p><div class="schedule-warning">Nothing is charged while you schedule. FOB SESH purchases are non-refundable, and changes inside 16 hours must be handled directly with Jah.</div>'+calendarButton('Calendar schedule request');actions.innerHTML='<a class="group-back-arrow" href="/claim-your-slot" aria-label="Back to SESH options">←</a>';return}
copy.innerHTML='<h3>Checking your held schedule…</h3><p>Your card is not being charged yet.</p>';actions.innerHTML='<a class="group-back-arrow" href="/claim-your-slot" aria-label="Back to SESH options">←</a>';
fetch('/api/calendar',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'planStatus',checkout:true,planId:schedule})}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.ok||!j.plan)throw new Error(j.error||'That schedule hold expired.');return j})}).then(function(j){var plan=j.plan,slots=(plan.slots||[]).slice().sort(function(a,b){return new Date(a.starts_at)-new Date(b.starts_at)});if(Number(plan.package_quantity)!==Number(pack)||slots.length!==Number(pack)||!['ready','checkout'].includes(plan.status))throw new Error('That schedule is incomplete or expired.');var editing=plan.status==='ready'?'<a class="presesh-link" href="/calendar?checkout=1&pack='+encodeURIComponent(pack)+'&source=payment&schedule='+encodeURIComponent(schedule)+'">Edit calendar schedule</a>':'<span class="presesh-link">Payment has already been opened for this schedule</span>';copy.innerHTML='<h3>Your schedule is held</h3><p><b>'+h(plan.session_type==='lift_sesh'?'LIFT SESH':'FOB SESH')+'</b><br>Preferred park: '+h(plan.park_name)+'</p><ul class="schedule-list">'+slots.map(function(s){return'<li>'+h(when(s.starts_at))+'</li>'}).join('')+'</ul><p>This hold is temporary. Confirm and pay to turn these into scheduled sessions.</p>'+editing;actions.innerHTML='<button class="flow-btn gold" id="seshPay" type="button"'+(plan.status==='checkout'?' disabled':'')+'>'+(plan.status==='checkout'?'Payment Already Open':'Confirm & Pay')+'</button><a class="group-back-arrow" href="/claim-your-slot" aria-label="Back to SESH options">←</a>';if(plan.status==='checkout')return;document.getElementById('seshPay').onclick=async function(){var b=this;b.disabled=true;b.textContent='OPENING PAYMENT…';try{var r=await fetch('/api/sesh-checkout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack:pack,schedulePlanId:schedule})}),x=await r.json();if(!r.ok||!x.ok||!x.url)throw new Error(x.error||'Checkout could not be opened.');try{localStorage.setItem('fob.calendar.pendingCheckout',JSON.stringify({planId:schedule,at:Date.now()}))}catch(_e){}location.href=x.url}catch(e){copy.insertAdjacentHTML('beforeend','<p class="schedule-warning">'+h(e.message)+'</p>');b.disabled=false;b.textContent='Confirm & Pay'}}}).catch(function(e){copy.innerHTML='<h3>Schedule hold needs attention</h3><p>'+h(e.message)+'</p>'+calendarButton('Choose schedule again');actions.innerHTML='<a class="group-back-arrow" href="/claim-your-slot" aria-label="Back to SESH options">←</a>'})}());
</script>
<script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(function(r){return r.update()}).catch(function(){})})}</script>
</body>
</html>
