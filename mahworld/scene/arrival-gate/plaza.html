<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#081530">
<title>MAHTROPOLIS Arrival Plaza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  :root{
    --ground:#081530; --ink:#eaf3ff; --dim:rgba(210,228,255,.62); --line:rgba(190,220,255,.28);
    --energy:#8fd0ff; --panel:rgba(6,14,32,.62);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:500 12px/1.4 "Space Grotesk",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
  canvas#plaza{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;flex-direction:column;gap:6px;padding:calc(12px + var(--safe-t)) 16px 0}
  .hud--top{top:0}
  .hud--bottom{top:auto;bottom:0;padding:0 16px calc(14px + var(--safe-b));align-items:flex-start}
  .eyebrow{letter-spacing:.32em;text-transform:uppercase;font-size:10px;color:var(--dim)}
  .title{letter-spacing:.14em;text-transform:uppercase;font-size:14px;font-weight:700;text-wrap:balance}
  .note{max-width:36ch;color:var(--dim);letter-spacing:.04em}
  .views{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
  .views button{appearance:none;font:inherit;letter-spacing:.22em;text-transform:uppercase;font-size:10px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-height:38px;backdrop-filter:blur(6px);cursor:pointer}
  .views button[aria-pressed="true"]{border-color:var(--energy);box-shadow:0 0 0 1px rgba(143,208,255,.35),0 0 18px rgba(143,208,255,.18)}
  .views button:focus-visible{outline:2px solid var(--energy);outline-offset:2px}
  .views button.tour{border-style:dashed}
  .hint{color:var(--dim);letter-spacing:.06em;font-size:11px}
  .meter{font-variant-numeric:tabular-nums;color:var(--dim);font-size:10px;letter-spacing:.12em}
  .fail{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:var(--ground)}
  .fail p{max-width:34ch;color:var(--dim)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.views button{transition:none}}
</style>
</head>
<body>
<canvas id="plaza" aria-label="MAHTROPOLIS arrival plaza, a rendered scene: a wet cobalt plaza with steps rising to the MAHWORLD gate"></canvas>

<header class="hud hud--top" data-hud>
  <span class="eyebrow">MAHWORLD · development scene v1</span>
  <span class="title">MAHTROPOLIS — Arrival Plaza</span>
  <span class="note">First visible place. Not linked from MAHFITT, not a game, no player, no network. Mr. Mah is not in this scene.</span>
</header>

<footer class="hud hud--bottom" data-hud>
  <div class="views" role="group" aria-label="Camera views">
    <button type="button" data-view="arrival" aria-pressed="true">Arrival</button>
    <button type="button" data-view="ascent" aria-pressed="false">Ascent</button>
    <button type="button" data-view="threshold" aria-pressed="false">Threshold</button>
    <button type="button" class="tour" data-tour>Tour</button>
  </div>
  <span class="hint">Drag to look · pinch or scroll to move</span>
  <span class="meter" data-meter>—</span>
</footer>

<div class="fail" data-fail><p>This scene needs WebGL. Open it in a current Safari, Chrome or Firefox.</p></div>

<script type="module">
  import { createPlaza } from './plaza.js';
  const canvas = document.getElementById('plaza');
  const q = new URLSearchParams(location.search);
  if (q.get('hud') === '0') document.querySelectorAll('[data-hud]').forEach(h => h.hidden = true);
  const meter = document.querySelector('[data-meter]');
  const buttons = Array.from(document.querySelectorAll('[data-view]'));
  let plaza = null;
  try {
    plaza = createPlaza(canvas, { hud: s => { if (meter && (s.frames % 20) === 0) meter.textContent = s.view.toUpperCase() + ' · ' + s.ms.toFixed(1) + ' ms/frame'; } });
  } catch (e) {
    document.querySelector('[data-fail]').style.display = 'grid';
    console.error(e);
  }
  if (plaza) {
    const paint = () => buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === plaza.state.view)));
    buttons.forEach(b => b.addEventListener('click', () => { plaza.setView(b.dataset.view); paint(); }));
    document.querySelector('[data-tour]').addEventListener('click', async () => { await plaza.tour(); paint(); });
    if (q.get('view') && plaza.views.indexOf(q.get('view')) > -1) { plaza.setView(q.get('view'), { instant: true }); paint(); }
    window.MAHWORLD_PLAZA = plaza;   /* for the capture script and for anyone inspecting the scene */
  }
</script>
</body>
</html>
