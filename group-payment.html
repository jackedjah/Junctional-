</head><body class="flow-page"><div class="flow-bg" aria-hidden="true"></div><main class="flow-wrap" id="page" style="opacity:.35;pointer-events:none"><div class="flow-divider"><span class="flow-beam"></span></div><header class="flow-top"><p class="flow-ey">FOB Systems · Small Group</p><h1 class="flow-title compact">SECURE YOUR<br>GROUP SPOT</h1><div class="flow-rule-short"></div><p class="flow-sub">Review. Pay. Join the cohort.</p></header><section class="flow-shell"><span class="flow-label">Selected Cohort</span><div class="flow-kv"><div><span>Group</span><b id="day">&ndash;</b></div><div><span>Time</span><b id="time">&ndash;</b></div><div><span>Location</span><b>Banneker Playground · Brooklyn</b></div><div><span>Availability</span><b style="color:var(--fob-gold-bright)">3 slots left</b></div></div><button class="flow-btn gold block" id="pay">PAY &amp; JOIN GROUP</button><p class="flow-copy" style="margin:16px auto 0;font-size:11px">Payment opens through the secure checkout link assigned to this cohort.</p><p class="flow-error" id="error" role="alert"></p></section><a class="flow-backlink" href="/small-group-access">← Back to groups</a><div class="flow-divider"><span class="flow-beam"></span></div></main><script>const GROUPS={sat:{day:'Saturday Afternoon',time:'10:00 AM – 11:30 AM'},mon:{day:'Monday Morning',time:'6:00 AM – 7:30 AM'},wed:{day:'Wednesday Morning',time:'6:00 AM – 7:30 AM'}};const q=new URLSearchParams(location.search),cohort=q.get('cohort'),g=GROUPS[cohort],page=document.getElementById('page'),err=document.getElementById('error'),pay=document.getElementById('pay');if(!g){location.replace('/small-group-access')}else{day.textContent=g.day;time.textContent=g.time}(async()=>{try{const r=await fetch('/api/group-status',{credentials:'same-origin'}),j=await r.json();if(!r.ok||!j.ok||j.cohort!==cohort){location.replace('/small-group-access');return}page.style.opacity='1';page.style.pointerEvents='auto'}catch(e){location.replace('/small-group-access')}})();pay.addEventListener('click',async()=>{pay.disabled=true;pay.textContent='OPENING PAYMENT…';err.textContent='';try{const r=await fetch('/api/group-checkout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({cohort})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Checkout could not be opened.');location.href=j.url}catch(e){err.textContent=e.message;pay.disabled=false;pay.textContent='PAY & JOIN GROUP'}});</script><script>if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(function(r){return r.update();}).catch(function(){});});}</script></body></html>
